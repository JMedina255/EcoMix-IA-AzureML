$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: ecomix-ia-independent-evaluation
experiment_name: ecomix-ia-evaluation
description: >
  Evaluación controlada e independiente del modelo ganador AutoML (VotingEnsemble)
  sobre el conjunto de 206 observaciones de prueba (concrete_test.csv) en su runtime original.

compute: azureml:cpu-cluster-ecomix

environment:
  image: mcr.microsoft.com/azureml/curated/ai-ml-automl:41

code: ../

inputs:
  # Modelo ganador VotingEnsemble generado por el job wheat_cheese_4swj34tkjn_11
  model_dir:
    type: mlflow_model
    path: azureml:azureml_wheat_cheese_4swj34tkjn_11_output_mlflow_log_model_873731674:1
  # Dataset de prueba independiente (206 filas, SHA-256 canónico: 6484d9f1493ca19ada7c7ec32ebf0a7015bcb1773605b2de428ff1b5a889026b)
  test_data:
    type: uri_file
    path: ../data/processed/concrete_test.csv
  # Dataset de entrenamiento para verificación objetiva de solapamiento (SHA-256 canónico: f6a854e3a237a55675f06bd07bb8d299be86a13de8968edd55b5d12a82a498fe)
  train_data:
    type: uri_file
    path: ../data/processed/concrete_train.csv

outputs:
  # Artefactos de evaluación: evaluation_wheat_cheese_4swj34tkjn.json y gráfico de correlación PNG
  reports_dir:
    type: uri_folder
    mode: rw_mount

command: >-
  python src/evaluate_model.py
  --evaluate
  --strict-checksums
  --model-path ${{inputs.model_dir}}
  --test-data ${{inputs.test_data}}
  --train-data ${{inputs.train_data}}
  --reports-dir ${{outputs.reports_dir}}
  --job-name wheat_cheese_4swj34tkjn

limits:
  timeout: 1800

resources:
  instance_count: 1

tags:
  project: EcoMix-IA
  phase: Fase-4.4-B-Independent-Evaluation
  winner_child_run: wheat_cheese_4swj34tkjn_11
  test_sha256: 6484d9f1493ca19ada7c7ec32ebf0a7015bcb1773605b2de428ff1b5a889026b
  test_samples: "206"
