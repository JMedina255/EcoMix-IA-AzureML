[pytest]
testpaths = tests
addopts = -v
# Clasificación estructurada de advertencias:
# Las 472 advertencias observadas provienen exclusivamente de esquemas internos de azure-ai-ml
# que utilizan construcciones deprecadas para la futura versión 4 de Marshmallow
# (RemovedInMarshmallow4Warning y ChangedInMarshmallow4Warning en azure.ai.ml._schema).
# Se filtran exclusivamente estas advertencias de terceros para evitar ruido en CI/local,
# preservando activas ('default') todas las advertencias emitidas por el código del proyecto.
filterwarnings =
    default
    ignore::marshmallow.warnings.RemovedInMarshmallow4Warning
    ignore::marshmallow.warnings.ChangedInMarshmallow4Warning
